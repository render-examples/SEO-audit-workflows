# SEO Auditor - Render Blueprint
#
# Deploys the frontend and API service. Choose either TypeScript or Python backend.
# NOTE: Render Workflows are created via the Dashboard, not render.yaml.
# See README.md for workflow setup instructions.

services:
  # Frontend (static site)
  - type: web
    name: seo-audit-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: seo-audit-api
          type: web
          property: host
      - key: VITE_DEMO_MODE
        value: ""  # Set to "true" to enable demo mode UI constraints
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # API service (TypeScript)
  - type: web
    name: seo-audit-api
    runtime: node
    plan: starter
    rootDir: typescript
    buildCommand: npm install && npm run build
    startCommand: node dist/api/index.js
    envVars:
      - key: RENDER_API_KEY
        sync: false
      - key: WORKFLOW_SLUG
        sync: false
      - key: WORKFLOW_ID
        sync: false
      - key: DEMO_MODE
        value: ""  # Set to "true" to enable demo mode rate/concurrency limits
      - key: FRONTEND_URL
        value: ""  # Set to frontend URL for origin validation in demo mode
      - key: NODE_VERSION
        value: "22"

  # ─────────────────────────────────────────────────────────────────────────────
  # ALTERNATIVE: Python API (uncomment below and comment out TypeScript above)
